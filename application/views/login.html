<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Sign In · PSA Samar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        <?php include 'login.css'; ?>
    </style>
</head>
<body>
    <div class="blue-header">
        <div class="header-content">
            <div class="official-logo">
                <img src="<?php echo base_url();?>images/login_images/logopsa.webp" alt="PSA Logo" class="logo-img">
            </div>
            <div class="official-text">
                <div class="official-line1">REPUBLIC OF THE PHILIPPINES</div>
                <div class="official-line2">PHILIPPINE STATISTICS AUTHORITY</div>
                <div class="official-line3">SAMAR</div>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="login-container">
            <div class="login-card">
                <div class="card-body-custom">
                    <div class="signin-header">
                        <h1 class="signin-title">Sign In</h1>
                    </div>

                    <form id="loginForm" action="#" method="post">
                        <div class="form-group-custom">
                            <label for="username" class="form-label-custom">Username</label>
                            <div class="input-group-custom">
                                <span class="input-icon"><i class="bi bi-person-fill"></i></span>
                                <input type="text" class="input-clean" id="username" name="username" placeholder="Enter your username" required>
                            </div>
                        </div>

                        <div class="form-group-custom">
                            <label for="password" class="form-label-custom">Password</label>
                            <div class="input-group-custom">
                                <span class="input-icon"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" class="input-clean" id="password" name="password" placeholder="Enter your password" required>
                            </div>
                        </div>
                        <div id="login_error" class="alert alert-danger d-none"></div>
                        <button type="submit" class="btn-signin">Sign In</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
<script>
    const base_url = '<?php echo base_url(); ?>';

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const username   = document.getElementById('username').value.trim();
        const password   = document.getElementById('password').value.trim();
        const btn        = document.querySelector('.btn-signin');
        const error_el   = document.getElementById('login_error');

        if (!username || !password) {
            error_el.textContent = 'Please enter your username and password.';
            error_el.classList.remove('d-none');
            return;
        }

        btn.disabled        = true;
        btn.textContent     = 'Signing in...';
        error_el.classList.add('d-none');

        fetch(base_url + 'i.php/sys_control/attempt_login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'X-Requested-With': 'XMLHttpRequest'
            },
            body: new URLSearchParams({
                username: username,
                password: password
            })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                window.location.href = data.redirect;
            } else {
                error_el.textContent = data.message;
                error_el.classList.remove('d-none');
                btn.disabled    = false;
                btn.textContent = 'Sign In';
            }
        })
        .catch(() => {
            error_el.textContent = 'Network error. Please try again.';
            error_el.classList.remove('d-none');
            btn.disabled    = false;
            btn.textContent = 'Sign In';
        });
    });
</script>
</html>
